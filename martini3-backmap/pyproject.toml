[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "m3backmap"
version = "0.1.0"
description = "Backmap Martini 3 coarse-grained structures (.gro/.pdb) to all-atom resolution"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.20"]

[project.scripts]
m3backmap = "m3backmap.cli:main"

[tool.setuptools]
packages = ["m3backmap"]

[tool.setuptools.package-data]
m3backmap = ["data/*.map"]
